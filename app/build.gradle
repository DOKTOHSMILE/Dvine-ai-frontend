plugins {
    id "com.android.application"
}

android {
    namespace "ai.dvine"
    compileSdk 35

    defaultConfig {
        applicationId "ai.dvine"
        minSdk 34
        targetSdk 35
        versionCode 31
        versionName "0.24.1"
        // the on-device language model (llama.cpp) is built for 64-bit ARM phones only
        ndk {
            abiFilters "arm64-v8a"
        }
        // the model runs at full speed in every build (an unoptimised debug build is several times slower)
        externalNativeBuild {
            cmake {
                arguments "-DCMAKE_BUILD_TYPE=Release"
            }
        }
    }

    ndkVersion "27.2.12479018"
    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    // the brain's engine is also kept ready-built in src/main/jniLibs, so a build without the C++ toolchain
    // (CodeAssist on the phone) still ships it; a full build makes the same library from src/main/cpp and keeps one
    packagingOptions {
        pickFirst "lib/arm64-v8a/libdvine_llm.so"
    }
}

// Test-only setup (JUnit, Robolectric) lives in tests.gradle so CodeAssist sees a plain build file.
apply from: "tests.gradle"
