plugins {
    id "com.android.application"
}

android {
    testOptions {
        unitTests.all {
            // Robolectric screens (the UI tour, screenshots) need more than the default 512 MB
            maxHeapSize = "2g"
        }
    }
    namespace "ai.ibiko"
    compileSdk 35

    defaultConfig {
        applicationId "ai.ibiko"
        minSdk 34
        targetSdk 35
        versionCode 304
        versionName "0.99.111"
        // the on-device language model (llama.cpp) is built for 64-bit ARM phones only
        ndk {
            abiFilters "arm64-v8a"
        }
        // the model runs at full speed in every build (an unoptimised debug build is several times slower)
        externalNativeBuild {
            cmake {
                arguments "-DCMAKE_BUILD_TYPE=Release"
            }
        }
    }

    ndkVersion "27.2.12479018"
    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            // shrink the shipped APK: R8 strips unused code/resources once tests prove the paths
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // the brain's engine is also kept ready-built in src/main/jniLibs, so a build without the C++ toolchain
    // (CodeAssist on the phone) still ships it; a full build makes the same library from src/main/cpp and keeps one.
    // Linux is started by libproot.so. It has to be unpacked onto disk or the phone will not run it.
    packagingOptions {
        pickFirst "lib/arm64-v8a/libibiko_llm.so"
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

// Test-only setup (JUnit, Robolectric) lives in tests.gradle so CodeAssist sees a plain build file.
apply from: "tests.gradle"

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core:1.12.0'
}

// appcompat brings kotlin-stdlib 1.8.22, which already contains the old kotlin-stdlib-jdk7 / -jdk8 classes; a
// library still asks for those 1.6.0 jars, and two copies of the same classes stop the APK build
// (checkDebugDuplicateClasses). Leave the old jars out.
configurations.configureEach {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}
