plugins {
    id "com.android.application"
}

android {
    namespace "ai.dvine"
    compileSdk 35

    defaultConfig {
        applicationId "ai.dvine"
        minSdk 34
        targetSdk 35
        versionCode 15
        versionName "0.11.3"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

// Test-only setup (JUnit, Robolectric) lives in tests.gradle so CodeAssist sees a plain build file.
apply from: "tests.gradle"
