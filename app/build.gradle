plugins {
    id "com.android.application"
}

android {
    namespace "ai.dvine"
    compileSdk 35

    defaultConfig {
        applicationId "ai.dvine"
        minSdk 34
        targetSdk 35
        versionCode 12
        versionName "0.11.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

// Test-only setup (JUnit, Robolectric) lives in tests.gradle so CodeAssist sees a plain build file.
apply from: "tests.gradle"
