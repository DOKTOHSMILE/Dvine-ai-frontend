// Unit and start-up tests. Not needed to build or install the app.
android {
    testOptions {
        unitTests.returnDefaultValues = true
        unitTests.includeAndroidResources = true
        unitTests.all {
            // Robolectric runs offline from a jar Gradle downloads (works behind proxies too)
            systemProperty "robolectric.offline", "true"
            systemProperty "robolectric.dependency.dir", "${rootProject.buildDir}/robolectric"
            dependsOn ":app:robolectricJars"
            // spread the 289 tests over the cores instead of one serial JVM
            maxParallelForks = (Runtime.runtime.availableProcessors().intdiv(2)) ?: 1
            forkEvery = 50
        }
    }
}

configurations {
    robolectricRuntime
}

dependencies {
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.robolectric:robolectric:4.14.1"
    robolectricRuntime "org.robolectric:android-all-instrumented:14-robolectric-10818077-i7"
    robolectricRuntime "org.robolectric:android-all-instrumented:15-robolectric-12650502-i7"
}

tasks.register("robolectricJars", Copy) {
    from configurations.robolectricRuntime
    into "${rootProject.buildDir}/robolectric"
}

// Builds the shipped 3D human assets (obi.dvhm, ivie.dvhm) from the anatomical recipe.
// Pure Java: runs on the compiled app classes, no device needed.


// After changing the engine's C++ (src/main/cpp), refresh the ready-built copy that builds without the NDK ship.
// Run it after a build, on its own: gradle :app:assembleDebug, then gradle :app:refreshNativeEngine, then build again.
// It strips the library the C++ build just made (not the packaged one: packaging prefers the ready-built copy, so
// copying that back would keep the old engine).
tasks.register('refreshNativeEngine', Exec) {
    doFirst {
        def built = fileTree("$buildDir/intermediates/cxx/Release") { include '*/obj/arm64-v8a/libdvine_llm.so' }.files
                .max { it.lastModified() }
        if (built == null) {
            throw new GradleException("Build the C++ first: gradle :app:assembleDebug")
        }
        def strip = new File(android.ndkDirectory, "toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip")
        commandLine strip.path, '--strip-unneeded', '-o', "$projectDir/src/main/jniLibs/arm64-v8a/libdvine_llm.so", built.path
    }
}
