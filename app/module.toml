version = 2

[module]
type = "android-app"
name = "app"
languageLevel = "JAVA_17"
output = "build/classes"

[sourceSets.androidTest]
scope = "TEST_IMPLEMENTATION"
java = ["src/androidTest/java", "src/androidTest/kotlin"]
resources = ["src/androidTest/resources"]

# Ibiko 1 (the ibiko1 library) is built in with the app here: CodeAssist builds this one module, Gradle builds ibiko1
# as its own library (app/build.gradle: implementation project(':ibiko1')).
[sourceSets.main]
scope = "IMPLEMENTATION"
assets = ["src/main/assets", "../ibiko1/src/main/assets"]
java = ["src/main/java", "src/main/kotlin", "../ibiko1/src/main/java"]
jniLibs = ["src/main/jniLibs"]
res = ["src/main/res"]
resources = ["src/main/resources"]

[sourceSets.test]
scope = "TEST_IMPLEMENTATION"
java = ["src/test/java", "src/test/kotlin"]
resources = ["src/test/resources"]

[dependencies]
implementation = ["androidx.appcompat:appcompat:1.6.1", "androidx.core:core:1.12.0", "kotlin-stdlib"]

[android]
namespace = "ai.ibiko"
compileSdk = 35
minSdk = 34
targetSdk = 35
manifest = "src/main/AndroidManifest.xml"
versionCode = 293
versionName = "0.99.100"
buildConfig = false
nonTransitiveRClass = false
isApplication = true
