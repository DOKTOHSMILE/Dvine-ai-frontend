name: CI

# Why this exists:
#   The Gradle build (especially the CMake/llama.cpp native compile) needs
#   more RAM than a phone has, so it OOMs on device (daemon killed, "A problem
#   occurred configuring root project"). Everything expensive runs here
#   instead: lint, Kotlin unit tests and the native build.
#
#   There is no gradlew in the repository, so the first step of every job
#   generates one with the same Gradle version setup-gradle provisions.
#
#   Which jobs are gates:
#     * unit tests  - blocking. These are the ones that fail on a bad change.
#     * debug build - blocking. Kotlin + the llama.cpp native compile.
#     * release build - blocking. The same with R8 shrinking (app/proguard-rules.pro), which debug never runs.
#     * Android lint - advisory (continue-on-error) while the report on main
#       is not proven clean; it uploads its HTML report either way, so a new
#       problem can be read without stopping every push.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    # nightly, so a dependency breaking us shows up without a push
    - cron: '30 3 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Android lint
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-read-only: false

      - name: Ensure Gradle wrapper exists
        run: |
          if [ ! -f ./gradlew ]; then
            gradle wrapper --gradle-version 8.9 --no-daemon
          fi
          chmod +x ./gradlew

      - name: Android lint
        run: ./gradlew lintDebug --no-daemon --stacktrace

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-*.html
          if-no-files-found: ignore
          retention-days: 14

  unit-test:
    name: Kotlin unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Ensure Gradle wrapper exists
        run: |
          if [ ! -f ./gradlew ]; then
            gradle wrapper --gradle-version 8.9 --no-daemon
          fi
          chmod +x ./gradlew

      - name: Unit tests (crew)
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 14

  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Ensure Gradle wrapper exists
        run: |
          if [ ! -f ./gradlew ]; then
            gradle wrapper --gradle-version 8.9 --no-daemon
          fi
          chmod +x ./gradlew

      - name: Build debug APK (Kotlin + llama.cpp via CMake)
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ibiko-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          # 24 hours: APKs are big, GitHub storage fills fast
          retention-days: 1
  release-build:
    name: Build release APK (R8)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # The release build shrinks and obfuscates with R8 (app/proguard-rules.pro); the debug build never runs it,
    # so a missing keep rule would only show on a phone. No keystore here: the APK comes out unsigned.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Ensure Gradle wrapper exists
        run: |
          if [ ! -f ./gradlew ]; then
            gradle wrapper --gradle-version 8.9 --no-daemon
          fi
          chmod +x ./gradlew

      - name: Build release APK (R8 + llama.cpp via CMake)
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload R8 mapping
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r8-mapping
          path: app/build/outputs/mapping/release/
          if-no-files-found: ignore
          retention-days: 7
